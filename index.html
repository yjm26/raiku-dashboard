<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <title>rkuSOL Holder &amp; Points Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&display=swap" />
    <!-- Start downloading the snapshot alongside the JS bundle instead of after it. -->
    <link rel="preload" href="/data/dashboard.json" as="fetch" crossorigin />
    <style>.boot-skeleton { visibility: hidden; }</style>
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash.
      try {
        var theme = localStorage.getItem('raiku-theme');
        if (theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000204');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static copy of LoadingState.jsx so the skeleton paints before the JS bundle runs; React replaces it. -->
      <div class="boot-skeleton app-shell app-shell--white min-h-screen bg-page text-ink"><div class="mx-auto w-full max-w-[1280px] px-4 sm:px-6 lg:px-8">
        <header class="flex h-16 items-center justify-between gap-3 border-b border-rule">
          <div class="flex min-w-0 items-center gap-3">
            <img src="/raiku-logo-dark.png" alt="Raiku" width="99" height="15" class="h-[15px] w-auto brightness-0 dark:brightness-100" />
            <span class="hidden h-4 w-px shrink-0 bg-rule-strong sm:block" aria-hidden="true"></span>
            <span class="hidden truncate text-[13px] font-medium text-muted sm:inline">Holder dashboard</span>
          </div>
          <div class="flex items-center gap-1.5" aria-hidden="true"><span class="skeleton block h-9 w-9 rounded-lg"></span><span class="skeleton block h-9 w-9 rounded-lg"></span><span class="skeleton block h-9 w-[92px] rounded-lg"></span></div>
        </header>
        <main class="app-main min-w-0" aria-busy="true">
          <p class="sr-only" role="status">Loading dashboard snapshot</p>
          <div aria-hidden="true">
            <div class="pb-7 pt-10 sm:pb-8 sm:pt-14">
              <p class="m-0 text-[34px] font-semibold leading-[1.05] tracking-[-0.035em] text-ink sm:text-[48px]">rkuSOL Holder &amp; Points</p>
              <div class="mt-3 flex h-[21px] items-center"><span class="skeleton block h-3.5 w-64 max-w-full"></span></div>
            </div>
            <div class="grid grid-cols-2 gap-px overflow-hidden rounded-xl border border-rule bg-rule lg:grid-cols-4">
              <div class="flex min-w-0 flex-col bg-surface p-4 sm:p-5"><p class="m-0 truncate text-[13px] text-muted">Supply</p><div class="mt-3 h-[26px] sm:h-[34px]"><span class="skeleton block h-full w-3/4"></span></div><div class="mt-2.5 flex h-[19.5px] items-center"><span class="skeleton block h-3 w-1/2"></span></div><div class="mt-auto h-[52px]"></div></div>
              <div class="flex min-w-0 flex-col bg-surface p-4 sm:p-5"><p class="m-0 truncate text-[13px] text-muted">TVL</p><div class="mt-3 h-[26px] sm:h-[34px]"><span class="skeleton block h-full w-3/4"></span></div><div class="mt-2.5 flex h-[19.5px] items-center"><span class="skeleton block h-3 w-1/2"></span></div><div class="mt-auto h-[52px]"></div></div>
              <div class="flex min-w-0 flex-col bg-surface p-4 sm:p-5"><p class="m-0 truncate text-[13px] text-muted">Real wallets</p><div class="mt-3 h-[26px] sm:h-[34px]"><span class="skeleton block h-full w-3/4"></span></div><div class="mt-2.5 flex h-[19.5px] items-center"><span class="skeleton block h-3 w-1/2"></span></div><div class="mt-auto h-[52px]"></div></div>
              <div class="flex min-w-0 flex-col bg-surface p-4 sm:p-5"><p class="m-0 truncate text-[13px] text-muted">Total estimated points</p><div class="mt-3 h-[26px] sm:h-[34px]"><span class="skeleton block h-full w-3/4"></span></div><div class="mt-2.5 flex h-[19.5px] items-center"><span class="skeleton block h-3 w-1/2"></span></div><div class="mt-auto h-[52px]"></div></div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-x-6 gap-y-5 sm:grid-cols-3 lg:grid-cols-5 lg:px-5">
              <div class="min-w-0"><p class="m-0 truncate text-[13px] text-muted">APY</p><div class="mt-1 flex h-[27px] items-center"><span class="skeleton block h-[18px] w-20"></span></div></div>
              <div class="min-w-0"><p class="m-0 truncate text-[13px] text-muted">rkuSOL rate</p><div class="mt-1 flex h-[27px] items-center"><span class="skeleton block h-[18px] w-20"></span></div></div>
              <div class="min-w-0"><p class="m-0 truncate text-[13px] text-muted">Holders</p><div class="mt-1 flex h-[27px] items-center"><span class="skeleton block h-[18px] w-20"></span></div></div>
              <div class="min-w-0"><p class="m-0 truncate text-[13px] text-muted">Official holders</p><div class="mt-1 flex h-[27px] items-center"><span class="skeleton block h-[18px] w-20"></span></div></div>
              <div class="min-w-0"><p class="m-0 truncate text-[13px] text-muted">Top-10 concentration</p><div class="mt-1 flex h-[27px] items-center"><span class="skeleton block h-[18px] w-20"></span></div></div>
            </div>
            <div class="panel mt-8 flex flex-col gap-3 p-4 sm:p-5 lg:flex-row lg:items-center lg:gap-8">
              <div class="shrink-0 lg:w-60"><p class="m-0 text-[15px] font-semibold text-ink">Look up a wallet</p><p class="m-0 mt-0.5 text-[13px] text-muted">Rank, balance and estimated points</p></div>
              <div class="flex min-w-0 flex-1 flex-col gap-2 sm:flex-row"><span class="skeleton block h-10 rounded-lg sm:flex-1"></span><span class="skeleton block h-10 rounded-lg sm:w-32"></span></div>
            </div>
            <div class="mt-14">
              <p class="m-0 mb-4 text-[20px] font-semibold leading-tight tracking-[-0.02em] text-ink">Distribution and growth</p>
              <div class="grid gap-4 lg:grid-cols-[minmax(0,2fr)_minmax(0,1fr)]">
                <div class="panel h-[330px] p-4 sm:p-5"><span class="skeleton block h-4 w-40"></span><span class="skeleton block mt-7 h-6 w-full"></span></div>
                <div class="panel h-[330px] p-4 sm:p-5"><span class="skeleton block h-4 w-28"></span></div>
              </div>
            </div>
          </div>
        </main>
      </div></div>
    </div>
    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
