name: Daily rkuSOL data update

on:
  schedule:
    # 07:15 WIB (UTC+7) = 00:15 UTC
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch firstSeen for new wallets
        run: node src/crawl_firstseen.mjs
        continue-on-error: true

      - name: Refresh daily snapshot
        run: npm run update

      - name: Build static site
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "raiku-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/ dist/
          git diff --cached --quiet || git commit -m "chore: daily rkuSOL data refresh [skip ci]"
          git push
