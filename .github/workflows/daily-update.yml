name: rkuSOL data update

on:
  schedule:
    # Every 3 hours on the hour, UTC: 00, 03, 06 ... 21 (07, 10, 13 ... WIB). GitHub may start late.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a late run waits instead of overlapping the next.
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Fetch firstSeen for new wallets
        run: node src/crawl_firstseen.mjs
        continue-on-error: true

      - name: Refresh daily snapshot
        run: npm run update

      - name: Build static site
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "raiku-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/ public/data/
          git diff --cached --quiet || git commit -m "chore: rkuSOL data refresh [skip ci]"
          git pull --rebase origin main
          git push
